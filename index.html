<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหน้าที่ - เวอร์ชั่นย้ายบ้านปลอดภัย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #e5e7eb; }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: block !important; }
        .staff-btn { transition: all 0.2s; border: 3px solid #fff; font-size: 1.4rem; }
        .staff-btn.active { background-color: #1e40af; color: white; border-color: #93c5fd; transform: scale(1.02); }
        .task-card { padding: 8px 12px !important; border-left: 6px solid #3b82f6; min-height: 70px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-slate-900 text-white p-4 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center"><i class="fas fa-house-chimney-window mr-3 text-cyan-400"></i> จัดการหน้าที่ (ระบบแยกส่วน)</h1>
            <div id="adminControls">
                <button id="adminBtn" onclick="toggleAdmin()" class="bg-slate-700 hover:bg-blue-600 px-5 py-2 rounded-xl text-lg border border-slate-600">
                    <i class="fas fa-lock mr-2"></i> แก้ไขข้อมูล
                </button>
                <button id="logoutBtn" onclick="logoutAdmin()" class="hidden bg-red-500 hover:bg-red-600 px-5 py-2 rounded-xl text-lg">
                    <i class="fas fa-sign-out-alt mr-2"></i> ปิดโหมดแก้ไข
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-[95%]">
        
        <!-- Admin Tools & Migration -->
        <div class="admin-only w-full space-y-6 mb-8">
            <!-- Migration Box (จะหายไปเมื่อย้ายเสร็จ) -->
            <div class="bg-orange-100 p-6 rounded-3xl border-2 border-orange-300 shadow-md">
                <h3 class="font-bold mb-2 text-xl text-orange-800"><i class="fas fa-box-open mr-2"></i> 📦 ระบบย้ายข้อมูล (กู้คืนจากระบบเดิม)</h3>
                <p class="text-orange-700 mb-4 text-lg">หากคุณเปลี่ยนมาใช้โค้ดนี้ครั้งแรก และข้อมูลเดิมหายไป ให้กดปุ่มนี้เพื่อดึงงานและชื่อคนเก่ากลับมาครับ</p>
                <button onclick="migrateData()" class="bg-orange-600 text-white px-10 py-4 rounded-2xl font-bold text-xl hover:bg-orange-700 shadow-lg transition-all">
                    <i class="fas fa-file-import mr-2"></i> ดึงข้อมูลเก่ามาใส่ระบบใหม่ทันที
                </button>
            </div>

            <div class="grid md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-2xl shadow border-b-8 border-green-500">
                    <h3 class="font-bold mb-4 text-xl">เพิ่มพนักงานใหม่</h3>
                    <div class="flex gap-2">
                        <input type="text" id="staffNameInput" placeholder="ชื่อเล่น..." class="border-2 p-4 rounded-xl flex-1 text-xl bg-gray-50">
                        <button onclick="addStaff()" class="bg-green-600 text-white px-8 py-4 rounded-xl font-bold text-xl hover:bg-green-700">เพิ่ม</button>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border-b-8 border-blue-500">
                    <h3 class="font-bold mb-3 text-xl">นำเข้างานชุดใหญ่</h3>
                    <select id="importStaffSelect" class="w-full border-2 p-3 rounded-xl mb-3 text-xl bg-gray-50"></select>
                    <textarea id="bulkTaskInput" rows="2" placeholder="วางรายการงาน..." class="w-full border-2 p-3 rounded-xl text-xl bg-gray-50 mb-3"></textarea>
                    <button onclick="importBulkTasks()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-xl hover:bg-blue-700">เริ่มนำเข้า</button>
                </div>
            </div>
        </div>

        <!-- View Navigation -->
        <div class="flex bg-gray-300 rounded-2xl p-2 mb-8 gap-2 shadow-inner">
            <button onclick="switchTab('staff')" id="tabStaff" class="flex-1 py-5 text-2xl font-bold rounded-xl transition-all">ดูรายชื่อพนักงาน</button>
            <button onclick="switchTab('tasks')" id="tabTasks" class="flex-1 py-5 text-2xl font-bold rounded-xl text-gray-600 transition-all">ดูงานทั้งหมด</button>
        </div>

        <div id="staffViewContainer">
            <div id="staffButtonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-10"></div>
            <div id="staffDetailView" class="hidden"></div>
        </div>

        <div id="tasksViewContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmAmceLCl40QTnWe3Prso-psMN6jNnY-U",
            authDomain: "supertest02-689bd.firebaseapp.com",
            databaseURL: "https://supertest02-689bd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "supertest02-689bd",
            appId: "1:941347468855:web:b19101cd3237d1896bb1b2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- PATH ใหม่ที่แยกห้องแล้ว ---
        const NEW_PATH_STAFF = 'task_system/employees';
        const NEW_PATH_TASKS = 'task_system/tasks';

        let employees = {};
        let tasks = {};
        let isAdmin = false;
        let selectedStaffId = null;
        let currentSearch = "";

        // --- Migration Function (หัวใจหลักของคุณ) ---
        window.migrateData = async () => {
            if (!confirm("ต้องการดึงข้อมูลจากระบบเก่ามาใส่ระบบใหม่ (ห้องส่วนตัว) ใช่หรือไม่?")) return;
            
            try {
                // 1. ดึงพนักงานเก่า
                const oldStaffSnap = await get(ref(db, 'employees'));
                if (oldStaffSnap.exists()) {
                    await set(ref(db, NEW_PATH_STAFF), oldStaffSnap.val());
                }

                // 2. ดึงงานเก่า
                const oldTasksSnap = await get(ref(db, 'tasks'));
                if (oldTasksSnap.exists()) {
                    await set(ref(db, NEW_PATH_TASKS), oldTasksSnap.val());
                }

                alert("✅ กู้คืนข้อมูลสำเร็จ! ข้อมูลถูกย้ายเข้าห้องส่วนตัวเรียบร้อยแล้วครับ");
                location.reload(); // รีโหลดหน้าจอเพื่อใช้ข้อมูลใหม่
            } catch (error) {
                alert("❌ เกิดข้อผิดพลาด: " + error.message);
            }
        };

        // Admin Toggle
        window.toggleAdmin = () => {
            if (prompt("ใส่รหัสเจ้าของร้าน:") === "202429") {
                isAdmin = true;
                document.body.classList.add('is-admin');
                document.getElementById('adminBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                renderAll();
            }
        };
        window.logoutAdmin = () => { location.reload(); };

        // Listeners (อ่านจากห้องใหม่)
        onValue(ref(db, NEW_PATH_STAFF), (snap) => { employees = snap.val() || {}; updateImportSelect(); renderAll(); });
        onValue(ref(db, NEW_PATH_TASKS), (snap) => { tasks = snap.val() || {}; renderAll(); });

        // Core Functions (ใช้ Path ใหม่ทั้งหมด)
        window.addStaff = () => {
            const name = document.getElementById('staffNameInput').value;
            if(name) { push(ref(db, NEW_PATH_STAFF), { name }); document.getElementById('staffNameInput').value = ''; }
        };
        window.editStaffName = (id, old) => {
            const n = prompt("แก้ไขชื่อ:", old);
            if(n && n !== old) update(ref(db, `${NEW_PATH_STAFF}/${id}`), { name: n });
        };
        window.editTaskTitle = (id, old) => {
            const n = prompt("แก้ไขงาน:", old);
            if(n && n !== old) update(ref(db, `${NEW_PATH_TASKS}/${id}`), { title: n });
        };
        window.deleteStaff = (id) => { if(confirm("ลบออกจากระบบหน้าที่?")) remove(ref(db, `${NEW_PATH_STAFF}/${id}`)); };
        window.deleteTask = (id) => { if(confirm("ลบงาน?")) remove(ref(db, `${NEW_PATH_TASKS}/${id}`)); };

        window.importBulkTasks = () => {
            const empId = document.getElementById('importStaffSelect').value;
            const text = document.getElementById('bulkTaskInput').value;
            if(!empId || !text) return alert("เลือกคนและวางข้อความ!");
            const list = text.split(/\n|\//).map(t => t.trim()).filter(t => t);
            list.forEach(t => push(ref(db, NEW_PATH_TASKS), { title: t, assignedTo: [empId] }));
            document.getElementById('bulkTaskInput').value = '';
        };

        window.handleSearch = () => {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            renderAll();
        };

        window.switchTab = (tab) => {
            const sView = document.getElementById('staffViewContainer');
            const tView = document.getElementById('tasksViewContainer');
            const tS = document.getElementById('tabStaff');
            const tT = document.getElementById('tabTasks');
            if(tab === 'staff') {
                sView.classList.remove('hidden'); tView.classList.add('hidden');
                tS.className = "flex-1 py-5 text-2xl font-bold rounded-xl bg-blue-700 text-white shadow-md";
                tT.className = "flex-1 py-5 text-2xl font-bold rounded-xl text-gray-600";
            } else {
                sView.classList.add('hidden'); tView.classList.remove('hidden');
                tT.className = "flex-1 py-5 text-2xl font-bold rounded-xl bg-blue-700 text-white shadow-md";
                tS.className = "flex-1 py-5 text-2xl font-bold rounded-xl text-gray-600";
            }
        };

        window.selectStaff = (id) => { selectedStaffId = (selectedStaffId === id) ? null : id; renderAll(); };

        function updateImportSelect() {
            const el = document.getElementById('importStaffSelect');
            el.innerHTML = '<option value="">-- เลือกพนักงาน --</option>' + 
                Object.keys(employees).map(id => `<option value="${id}">${employees[id].name}</option>`).join('');
        }

        function renderAll() {
            renderStaffButtons();
            renderStaffDetail();
            renderTasksTotal();
            if(!document.getElementById('tabStaff').classList.contains('bg-blue-700') && !document.getElementById('tabTasks').classList.contains('bg-blue-700')) {
                switchTab('staff');
            }
        }

        function renderStaffButtons() {
            const grid = document.getElementById('staffButtonGrid');
            grid.innerHTML = Object.keys(employees).map(id => {
                const name = employees[id].name;
                if(currentSearch !== "" && !name.toLowerCase().includes(currentSearch)) return '';
                return `
                    <div class="relative group">
                        <button onclick="selectStaff('${id}')" 
                            class="staff-btn w-full py-6 px-2 rounded-2xl bg-white shadow-md font-bold text-gray-800 ${selectedStaffId === id ? 'active' : ''}">
                            ${name}
                        </button>
                        <div class="admin-only absolute -top-2 -right-2 flex gap-1">
                            <button onclick="editStaffName('${id}', '${name}')" class="bg-blue-500 text-white w-8 h-8 rounded-full shadow-lg border-2 border-white"><i class="fas fa-pen text-xs"></i></button>
                            <button onclick="deleteStaff('${id}')" class="bg-red-500 text-white w-8 h-8 rounded-full shadow-lg border-2 border-white"><i class="fas fa-times text-xs"></i></button>
                        </div>
                    </div>`;
            }).join('');
        }

        function renderStaffDetail() {
            const detail = document.getElementById('staffDetailView');
            if(!selectedStaffId) { detail.classList.add('hidden'); return; }
            detail.classList.remove('hidden');
            const name = employees[selectedStaffId]?.name || '';
            const staffTasks = Object.keys(tasks).filter(tid => tasks[tid].assignedTo?.includes(selectedStaffId));

            detail.innerHTML = `
                <div class="bg-white rounded-3xl p-6 shadow-xl border-t-8 border-blue-600">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-slate-900">งานของ <span class="text-blue-700 underline">${name}</span></h2>
                        <span class="bg-yellow-400 text-slate-900 px-6 py-1 rounded-full text-xl font-black">${staffTasks.length} อย่าง</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                        ${staffTasks.map(tid => `
                            <div class="task-card bg-gray-50 rounded-xl border-2 border-gray-200">
                                <div class="text-slate-900 text-[1.3rem] font-bold leading-tight">${tasks[tid].title}</div>
                                <div class="admin-only flex justify-end gap-3 mt-1">
                                    <button onclick="editTaskTitle('${tid}', '${tasks[tid].title}')" class="text-blue-500 text-sm">แก้</button>
                                    <button onclick="deleteTask('${tid}')" class="text-red-400 text-sm">ลบ</button>
                                </div>
                            </div>
                        `).join('') || '<p class="col-span-full text-center text-gray-400 py-10">ยังไม่ได้ลงงาน</p>'}
                    </div>
                    <button onclick="selectStaff(null)" class="mt-8 w-full py-4 bg-slate-100 rounded-2xl text-xl font-bold text-slate-400 uppercase">ปิดหน้านี้</button>
                </div>`;
        }

        function renderTasksTotal() {
            const container = document.getElementById('tasksViewContainer');
            container.innerHTML = Object.keys(tasks).map(tid => {
                const title = tasks[tid].title;
                const assigned = (tasks[tid].assignedTo || []).map(eid => employees[eid]?.name || '<span class="text-red-400">?</span>').join(', ');
                if(currentSearch !== "" && !title.toLowerCase().includes(currentSearch) && !assigned.toLowerCase().includes(currentSearch)) return '';
                return `
                    <div class="bg-white p-4 rounded-xl shadow border-l-8 border-blue-400">
                        <div class="text-slate-900 font-bold text-xl mb-1">${title}</div>
                        <div class="text-lg text-blue-700 font-semibold italic">คนรับผิดชอบ: ${assigned}</div>
                    </div>`;
            }).join('');
        }
    </script>
</body>
</html>
